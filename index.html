<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Inquiry Form</title>
  
  <!-- Bootstrap 5 CSS Framework -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --primary-navy: #1B365D;
      --accent-teal: #008080;
      --bg-light: #F2F4F8;
    }

    body {
      background-color: var(--bg-light);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .contact-section {
      padding-top: 3rem;
      padding-bottom: 3rem;
    }

    .btn-primary {
      background-color: var(--primary-navy);
      border-color: var(--primary-navy);
    }

    .btn-primary:hover,
    .btn-primary:focus {
      background-color: var(--accent-teal);
      border-color: var(--accent-teal);
    }
  </style>
</head>
<body>

  <section class="contact-section" id="contact">
    <div class="container" style="max-width: 600px;">
      <h2 class="section-title text-center mb-4">Student Inquiry Form</h2>
      
      <form id="inquiryForm" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="studentName" class="form-label">Full Name</label>
          <input 
            type="text" 
            class="form-control" 
            id="studentName" 
            required 
            aria-describedby="nameFeedback"
            autocomplete="name"
          >
          <div id="nameFeedback" class="invalid-feedback">
            Please enter your full name.
          </div>
        </div>

        <div class="mb-3">
          <label for="studentEmail" class="form-label">Email Address</label>
          <input 
            type="email" 
            class="form-control" 
            id="studentEmail" 
            required 
            aria-describedby="emailFeedback"
            autocomplete="email"
          >
          <div id="emailFeedback" class="invalid-feedback">
            Please enter a valid email address.
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100">Submit Inquiry</button>
      </form>
    </div>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("inquiryForm");
      const submitBtn = document.getElementById("submitBtn");
      const scriptURL = "https://script.google.com/macros/s/AKfycbwSclwO6LwIhSqI2fa-4dsHEayhqY19au5QRrfTcQwXseY34RszpxtCoMqfmk8EmgCxiw/exec";

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!form.checkValidity()) {
          event.stopPropagation();
          form.classList.add("was-validated");
        } else {
          submitBtn.disabled = true;
          submitBtn.innerText = "Submitting...";

          const studentData = {
            name: document.getElementById("studentName").value.trim(),
            email: document.getElementById("studentEmail").value.trim()
          };

          // Send POST request with text/plain to bypass CORS browser blocks
          fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(studentData)
          })
          .then(() => {
            alert("Thank you! Your inquiry has been submitted.");
            form.reset();
            form.classList.remove("was-validated");
          })
          .catch(error => {
            console.error("Error submitting form:", error);
            alert("Submission failed. Please try again.");
          })
          .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Inquiry";
          });
        }
      });
    });
  </script>
</body>
</html>
